[project]
name = "metadata-tools"
version = "0.1.0"
description = "Memory-bounded chunked reading of CSV, Stata and SPSS data files"
readme = "README.md"
authors = [
    { name = "Mehmood Asghar", email = "mah0001@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=18",
    "pyreadstat>=1.2.8",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
